[package]
name = "localsub-npu"
version = "0.5.0"
description = "Offline local subtitle generation with Intel NPU preference"
authors = ["Minh Phu Luong"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
