name: Release (Windows installer)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "apps/inference/packaging/**"
      - "apps/inference/pyproject.toml"
      - "apps/desktop/src-tauri/tauri.bundle.conf.json"
      - "apps/desktop/src-tauri/src/worker.rs"
      - "scripts/build-worker.ps1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/inference/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build frozen worker (PyInstaller) + smoke test
        shell: pwsh
        run: ./scripts/build-worker.ps1 -Python (Get-Command python).Source

      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npx tauri build --bundles nsis --config src-tauri/tauri.bundle.conf.json

      - name: Silent install + run bundled worker
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer not found" }
          "Installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB)) MB)"
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter localsub-worker.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\worker\\localsub-worker.exe$" } | Select-Object -First 1
          if (-not $exe) { throw "bundled worker not installed" }
          "Installed worker: $($exe.FullName)"
          $env:LOCALSUB_MODEL_DIR = "$env:TEMP\ls-installed\models"
          $env:LOCALSUB_OUTPUT_DIR = "$env:TEMP\ls-installed\output"
          & $exe.FullName diagnostics
          if ($LASTEXITCODE -ne 0) { throw "installed worker failed" }
          $app = Get-ChildItem (Split-Path (Split-Path $exe.FullName)) -Filter *.exe |
            Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $app) { throw "desktop executable not installed" }
          "Installed app: $($app.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: localsub-npu-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: localsub-npu-windows-installer
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          generate_release_notes: true
          body: |
            Bộ cài Windows (x64) của LocalSub NPU — không cần Python/Node/Rust.
            Cần cài FFmpeg riêng: `winget install Gyan.FFmpeg`. Bộ cài chưa ký số nên
            Windows SmartScreen có thể cảnh báo: chọn "More info" → "Run anyway".
